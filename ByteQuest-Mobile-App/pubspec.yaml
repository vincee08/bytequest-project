name: bytequest
description: A Gamified Simulation Platform with Automated Skill Evaluation for NC II Computer Systems Servicing
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Backend - Supabase
  supabase_flutter: ^2.5.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  http: ^1.2.0
  crypto: 3.0.7
  file_picker: 13.3.3
  http_parser: ^4.1.2
  
  # Smooth Page Indicator
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ByteQuest Logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ByteQuest Logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Bundle the approved typeface so the local learner preview and Android app
  # can render text without fetching a fallback font from the network.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
  
  assets:
    - assets/fonts/OFL-Plus-Jakarta-Sans.txt
    - assets/images/
    - assets/COC1/Mission 1/
    - assets/COC1/Mission 2/
    - .env
    - assets/COC1/Mission 3/
    - assets/COC2/Mission 1/
    - assets/parts/
